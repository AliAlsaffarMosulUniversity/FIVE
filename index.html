<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>مختبر علوم الخامس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: a young scientist's graph-paper notebook — one column, each unit its own bright ink colour */
:root{
  --bg:#F8F2E7; --grid:rgba(123,30,43,.05); --paper:#FFFCF6; --ink:#24171A; --muted:#4F4042; --line:#E6DAC6;
  --btn:#7B1E2B; --btn-hi:#5E1520; --btn-ink:#FFFFFF; --btn-soft:#F3E3E0; --on-c:#FFFFFF;
  --u1:#2E7D3E; --u1s:#E8F1E1;  /* التصنيف والتنوع */
  --u2:#B3362C; --u2s:#F8E4DD;  /* جسم الإنسان */
  --u3:#6A3FAE; --u3s:#EEE6F4;  /* المادة */
  --u4:#A66300; --u4s:#F8EAD2;  /* القوة والطاقة */
  --u5:#1F5F9E; --u5s:#E3ECF2;  /* الأرض والكون */
  --ok:#1E7A3C; --oks:#E1F1E0; --bad:#B3261E; --bads:#F8E0DC; --gold:#D99A00;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --shadow:0 2px 0 rgba(80,40,30,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1415; --grid:rgba(255,230,210,.035); --paper:#251C1E; --ink:#F7EEE3; --muted:#D6C7BC; --line:#3F3033;
  --btn:#A8394A; --btn-hi:#C04A5C; --btn-ink:#FFFFFF; --btn-soft:#3A2227; --on-c:#1A1415;
  --u1:#7CC98A; --u1s:#22302A; --u2:#F08A7E; --u2s:#3A2426; --u3:#B99BEB; --u3s:#2D2638;
  --u4:#F0B460; --u4s:#382C1D; --u5:#7FB4EA; --u5s:#1F2B38;
  --ok:#6FD38E; --oks:#1E3326; --bad:#FF8A80; --bads:#3F2226; --gold:#FFC93A; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1415; --grid:rgba(255,230,210,.035); --paper:#251C1E; --ink:#F7EEE3; --muted:#D6C7BC; --line:#3F3033;
  --btn:#A8394A; --btn-hi:#C04A5C; --btn-ink:#FFFFFF; --btn-soft:#3A2227; --on-c:#1A1415;
  --u1:#7CC98A; --u1s:#22302A; --u2:#F08A7E; --u2s:#3A2426; --u3:#B99BEB; --u3s:#2D2638;
  --u4:#F0B460; --u4s:#382C1D; --u5:#7FB4EA; --u5s:#1F2B38;
  --ok:#6FD38E; --oks:#1E3326; --bad:#FF8A80; --bads:#3F2226; --gold:#FFC93A; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--c,var(--u5));outline-offset:3px;border-radius:14px}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;flex:none}
.bar h1{font-size:1.3rem;flex:1;min-width:0}
.bar h1 small{display:block;font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:500;line-height:1.3}
.starpill{display:flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.starpill b{color:var(--gold)}
.back{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;padding:6px 12px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}

main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}

/* home */
.hello{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow)}
.hello .big{font-size:2.6rem;line-height:1}
.hello h2{font-size:1.45rem}
.hello p{margin:2px 0 0;color:var(--muted);font-size:1rem}
.meter{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--u1),var(--u5),var(--u3));border-radius:99px;transition:width .5s}

.unit{display:flex;flex-direction:column;gap:10px}
.unit-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit-h .tag{font-family:var(--display);font-weight:800;color:var(--on-c);background:var(--c);padding:0 12px;border-radius:10px;font-size:.95rem}
.unit-h h2{font-size:1.35rem;color:var(--c)}
.chs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.chs{grid-template-columns:1fr}}
.ch{display:flex;gap:14px;align-items:center;text-align:right;background:var(--paper);border:2px solid var(--line);border-bottom:5px solid var(--c);border-radius:20px;padding:14px;transition:transform .15s}
.ch:hover{transform:translateY(-2px)}
.ch .em{flex:none;width:58px;height:58px;border-radius:18px;background:var(--cs);display:grid;place-items:center;font-size:1.9rem}
.ch .tx{min-width:0;flex:1}
.ch .no{font-size:.82rem;color:var(--c);font-weight:700}
.ch h3{font-size:1.12rem}
.stars{display:flex;gap:2px;font-size:1rem;margin-top:2px;letter-spacing:1px}
.stars .on{color:var(--gold)} .stars .off{color:var(--line)}

.challenge{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);border-radius:22px;padding:18px 20px;text-align:right}
.challenge .em{font-size:2.2rem}
.challenge h3{font-size:1.25rem}
.challenge p{margin:0;opacity:.8;font-size:.95rem}
.challenge .go{margin-inline-start:auto;font-family:var(--display);font-weight:800;background:var(--gold);color:#1B1B1B;border-radius:14px;padding:6px 16px;white-space:nowrap}

/* chapter */
.hero{background:var(--c);color:var(--on-c);border-radius:24px;padding:20px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero .em{flex:none;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:2.4rem}
.hero .no{font-size:.9rem;opacity:.9;font-weight:700}
.hero h2{font-size:1.6rem}
.hero::after{content:"";position:absolute;inset:auto -30px -50px auto;width:150px;height:150px;border-radius:50%;border:18px solid rgba(255,255,255,.12)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4}
.tab{font-family:var(--display);font-weight:700;font-size:1.02rem;padding:8px 4px;border-radius:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tab .ic{font-size:1.25rem}
.tab[aria-selected="true"]{background:var(--c);color:var(--on-c)}

.lesson{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.lesson-h{display:flex;align-items:center;gap:10px}
.lesson-h .n{flex:none;font-family:var(--display);font-weight:800;color:var(--c);background:var(--cs);border-radius:12px;padding:0 12px;font-size:.95rem}
.lesson-h h3{font-size:1.3rem}
.idea{background:var(--cs);border-radius:16px;padding:12px 14px;font-weight:500}
.idea b.lb{display:block;font-family:var(--display);color:var(--c);font-size:.95rem}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pts li{display:flex;gap:10px;align-items:flex-start}
.pts li::before{content:"";flex:none;width:12px;height:12px;border-radius:4px;background:var(--c);margin-top:.6em;transform:rotate(45deg)}
.pts b{color:var(--c)}
.fact{border:2px dashed var(--c);border-radius:16px;padding:10px 14px;font-size:1rem}
.fact b.lb{font-family:var(--display);color:var(--c)}
.cta{display:flex;justify-content:center}
.btn{font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--c);color:var(--on-c);border-radius:16px;padding:10px 22px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--paper);color:var(--c);border:2px solid var(--c);box-shadow:none}

/* flashcards */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc-hint{color:var(--muted);font-size:.95rem;margin:0}
.fc{width:100%;max-width:440px;aspect-ratio:4/3;perspective:1200px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:8px}
.front{background:var(--paper);border:3px solid var(--c);box-shadow:0 6px 0 var(--c)}
.front .w{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--c);line-height:1.3}
.front .s{color:var(--muted);font-size:.9rem}
.back-f{background:var(--c);color:var(--on-c);transform:rotateY(180deg);font-size:1.2rem;font-weight:500;line-height:1.7}
.fc-nav{display:flex;gap:10px;align-items:center}
.fc-count{font-family:var(--display);font-weight:800;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}

/* quiz */
.qbox{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.qtop .sc{color:var(--c)}
.qbar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.qbar i{display:block;height:100%;background:var(--c);transition:width .3s}
.q{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--paper);font-size:1.08rem;font-weight:500;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:34px;height:34px;border-radius:11px;background:var(--cs);color:var(--c);font-family:var(--display);font-weight:800;display:grid;place-items:center}
.opt:not([disabled]):hover{border-color:var(--c)}
.opt.right{border-color:var(--ok);background:var(--oks)} .opt.right .k{background:var(--ok);color:var(--on-c)}
.opt.wrong{border-color:var(--bad);background:var(--bads)} .opt.wrong .k{background:var(--bad);color:var(--on-c)}
.opt[disabled]{cursor:default}
.fb{border-radius:16px;padding:12px 14px;font-size:1.02rem}
.fb.good{background:var(--oks)} .fb.bad{background:var(--bads)}
.fb b{font-family:var(--display);font-size:1.15rem;display:block}
.qnext{display:flex;justify-content:flex-start}

.result{text-align:center;align-items:center}
.result .big{font-size:3.4rem;line-height:1}
.result h3{font-size:1.6rem}
.result .rs{font-size:2.2rem;letter-spacing:6px}
.result .rs .on{color:var(--gold)} .result .rs .off{color:var(--line)}
.result .num{font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--c);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.review{text-align:right;width:100%;display:flex;flex-direction:column;gap:8px}
.review h4{font-family:var(--display);margin:0;font-size:1.1rem}
.rv{border-inline-start:5px solid var(--bad);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:1rem}
.rv .a{color:var(--ok);font-weight:700}

.foot{text-align:center;color:var(--muted);font-size:.85rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
/* milky + maroon theme: clear text, maroon controls */
body{font-size:19px;font-weight:500;line-height:1.85}
.pts li,.idea,.fact,.opt,.fb,.rv{color:var(--ink)}
.hello p,.fc-hint,.qtop,.foot{color:var(--muted)}
.btn{background:var(--btn);color:var(--btn-ink)}
.btn:hover{background:var(--btn-hi)}
.btn.ghost{background:var(--paper);color:var(--btn);border:2px solid var(--btn)}
.btn.ghost:hover{background:var(--btn-soft)}
.back,.themebtn{background:var(--btn);color:var(--btn-ink);border:0}
.themebtn{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.opt:not([disabled]):hover{border-color:var(--btn)}
.opt .k{background:var(--btn-soft);color:var(--btn)}
.qbar i{background:var(--btn)}
.qtop .sc,.result .num{color:var(--btn)}
.challenge{background:var(--btn);color:var(--btn-ink)}
.challenge .go{background:var(--paper);color:var(--btn)}
.hero.chal{background:var(--btn);color:var(--btn-ink)}
.meter i{background:var(--btn)}
button:focus-visible{outline-color:var(--btn)}
/* book figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fig{margin:0;background:#FFFFFF;border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:zoom-in;padding:0;text-align:right}
.fig img{display:block;width:100%;height:180px;object-fit:contain;background:#FFFFFF;padding:6px}
.fig.wide{grid-column:1/-1} .fig.wide img{height:auto;max-height:340px}
.fig figcaption{background:var(--paper);border-top:2px solid var(--line);padding:6px 12px;font-size:.95rem;color:var(--ink);font-weight:500;line-height:1.5}
.lbox{position:fixed;inset:0;z-index:30;background:rgba(20,10,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lbox img{max-width:100%;max-height:78vh;background:#FFFFFF;border-radius:14px}
.lbox p{color:#FFFFFF;font-family:var(--display);font-size:1.2rem;margin:0;text-align:center}
.lbox button{font-family:var(--display);font-weight:800;background:var(--btn);color:#FFFFFF;border-radius:14px;padding:6px 18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<header class="bar"><div class="bar-in" id="bar"></div></header>
<main id="app"></main>

<script>
const UNITS=[
 {n:"الوحدة الأولى",t:"التصنيف والتنوع",k:"u1"},
 {n:"الوحدة الثانية",t:"جسم الإنسان وصحته",k:"u2"},
 {n:"الوحدة الثالثة",t:"المادة",k:"u3"},
 {n:"الوحدة الرابعة",t:"القوة والطاقة",k:"u4"},
 {n:"الوحدة الخامسة",t:"الأرض والكون",k:"u5"}];

const CH=[
{u:0,no:"الفصل الأول",t:"النباتات الزهرية واللازهرية",e:"🌸",
lessons:[
 {t:"النباتات الزهرية",idea:"نباتات تكوّن أزهاراً، والأزهار تتحول إلى ثمار في داخلها بذور. لذلك الزهرة هي عضو التكاثر في النبات.",
  pts:["تتكون الزهرة من أربعة أجزاء:","**الكأس**: أوراق خضراء تحمي الزهرة.","**التويج**: أوراق ملونة تجذب النحل والفراشات والطيور.","**الطلع**: عضو التكاثر الذكري، يكوّن حبوب اللقاح.","**المتاع**: عضو التكاثر الأنثوي، فيه المبيض والبويضات.","**التلقيح**: انتقال حبوب اللقاح من الطلع إلى المتاع، بالرياح غالباً أو بالحشرات والطيور.","**الإخصاب**: اتحاد حبة اللقاح بالبويضة، فتتكون البذور وينتفخ المبيض ليصبح ثمرة.","البذور نوعان: **ذوات الفلقة الواحدة** مثل القمح والذرة، و**ذوات الفلقتين** مثل الباقلاء.","أجزاء البذرة: **الغلاف** يحمي، و**الفلقات** تخزن الغذاء، و**الجنين** ينمو نباتاً جديداً."],
  fact:"بعض الأزهار فيها عضو التكاثر الأنثوي فقط، وبعضها فيها الذكري فقط."},
 {t:"النباتات اللازهرية",idea:"نباتات لا تكوّن أزهاراً ولا بذوراً طوال حياتها، وتتكاثر بالأبواغ، وتعيش في الأماكن الرطبة الظليلة.",
  pts:["**الأبواغ**: وسيلة تكاثر النباتات اللازهرية.","تنقسم إلى مجموعتين: الحزازيات والسرخسيات.","**الحزازيات**: نباتات خضراء صغيرة، تنمو على الصخور والجدران القديمة الرطبة.","أبواغ الحزازيات داخل **كيس الأبواغ**، وهو غلاف قوي يحميها من الحرارة وقلة الماء.","**السرخسيات**: لها جذور وسيقان وأوراق بسيطة، فهي أكثر تعقيداً من الحزازيات.","أكياس الأبواغ في السرخسيات توجد على **السطح السفلي للأوراق**.","تُستخدم كثير منها نباتات زينة داخل البيوت."],
  fact:"التناظر في الأزهار: زهرة الجوري متناظرة شعاعياً، وزهرة الباقلاء متناظرة جانبياً، وزهرة الموز عديمة التناظر."}],
vocab:[["الكأس","أوراق خضراء تحمي الزهرة"],["التويج","أوراق الزهرة الملونة، تجذب الحشرات"],["الطلع","عضو التكاثر الذكري، يكوّن حبوب اللقاح"],["المتاع","عضو التكاثر الأنثوي، فيه المبيض والبويضات"],["التلقيح","انتقال حبوب اللقاح من الطلع إلى المتاع"],["الإخصاب","اتحاد حبة اللقاح بالبويضة"],["ذوات الفلقة الواحدة","بذرتها كتلة واحدة، مثل القمح والذرة"],["ذوات الفلقتين","بذرتها نصفان متماثلان، مثل الباقلاء"],["الأبواغ","وسيلة تكاثر النباتات اللازهرية"],["كيس الأبواغ","غلاف قوي يحمي الأبواغ من الحرارة وقلة الماء"]],
quiz:[
 ["ما جزء الزهرة الذي يحميها؟",["الكأس","التويج","الطلع","المتاع"],"الكأس أوراق خضراء وظيفتها حماية الزهرة."],

{u:0,no:"الفصل الثاني",t:"الحيوانات الفقرية واللافقرية",e:"🐟",
lessons:[
 {t:"الحيوانات الفقرية",idea:"حيوانات لها عمود فقري في الجهة الظهرية من جسمها، وتصنف إلى خمس مجموعات.",
  pts:["**العمود الفقري**: سلسلة من الفقرات، وظيفته الدعم والإسناد وحرية الحركة.","**ثابتة درجة الحرارة**: لا تتغير حرارة جسمها مع المحيط، مثل الطيور والثدييات.","**متغيرة درجة الحرارة**: تتغير حرارة جسمها مع المحيط، مثل الأسماك والبرمائيات والزواحف.","**الأسماك**: تعيش في الماء، جسمها انسيابي بلا عنق، تغطيه قشور، وتتحرك بالزعانف، وتضع بيضاً كثيراً.","**البرمائيات**: مثل الضفدع، تقضي جزءاً من حياتها في الماء وجزءاً على اليابسة، وتتنفس بالرئتين وبجلدها الرطب.","**الزواحف**: مثل الأفاعي والسلاحف والتماسيح، يغطيها حراشف تقلل تبخر الماء، وتتنفس بالرئتين.","**الطيور**: يغطيها الريش، لها مناقير بلا أسنان، والطائرة منها عظامها مجوفة خفيفة.","**الثدييات**: يكسوها الشعر أو الفراء، تلد وترضع صغارها، ومنها الدلافين والحيتان والخفاش."],
  fact:"الخفاش هو الثديي الوحيد القادر على الطيران."},
 {t:"الحيوانات اللافقرية",idea:"حيوانات ليس لها عمود فقري ولا هيكل عظمي، منتشرة في كل مكان، وأشكالها وأحجامها مختلفة.",
  pts:["تشكل اللافقريات نحو **95%** من أنواع الحيوانات.","**المساميات**: أبسطها، مثل الإسفنج، جسمه مملوء بالثقوب، ويعيش ثابتاً على صخرة في الماء.","**الديدان**: دودة الأرض تحفر أنفاقاً تهوي التربة، وديدان أخرى مثل الإسكارس تسبب الأمراض.","**المفصليات**: لها أرجل مفصلية، وجسمها رأس وصدر وبطن، وهي أكبر مجموعة من اللافقريات.","الروبيان والسرطان يتنفسان بالخياشيم، والحشرات تتنفس بأنابيب دقيقة.","**قرون الاستشعار**: زوج من اللوامس على رأس الحشرة، وظيفتها التحسس.","بعض اللافقريات مثل الحلزون لها جزء صلب يحميها من الأخطار."],
  fact:"الفراشة متناظرة جانبياً، وقنديل البحر متناظر شعاعياً، والإسفنج عديم التناظر."}],
vocab:[["العمود الفقري","سلسلة فقرات تدعم الجسم وتسمح بالحركة"],["ثابتة درجة الحرارة","حيوانات لا تتغير حرارتها مع المحيط"],["متغيرة درجة الحرارة","حيوانات تتغير حرارتها مع المحيط"],["البرمائيات","تعيش في الماء ثم على اليابسة، مثل الضفدع"],["الثدييات","ترضع صغارها، ويكسوها الشعر أو الفراء"],["الحيوانات اللافقرية","حيوانات بلا عمود فقري ولا هيكل عظمي"],["المساميات","حيوانات جسمها مملوء بالثقوب، مثل الإسفنج"],["المفصليات","لها أرجل مفصلية، وجسمها رأس وصدر وبطن"],["قرون الاستشعار","لوامس على رأس الحشرة للتحسس"]],
quiz:[
 ["الحيوانات الفقرية تمتلك:",["عموداً فقرياً في الجهة الظهرية","قرون استشعار","جسماً مملوءاً بالثقوب","أرجلاً مفصلية"],"العمود الفقري يمتد في الناحية الظهرية للجسم."],
 ["ما وظيفة العمود الفقري؟",["الدعم والإسناد وحرية الحركة","هضم الطعام","نقل الدم","التنفس"],"العمود الفقري يسند الجسم كما تسند العصا الخيمة."],
 ["أي حيوان ثابت درجة الحرارة؟",["الحمامة","الضفدع","السمكة","الأفعى"],"الطيور والثدييات ثابتة درجة الحرارة."],
 ["ماذا يغطي أجسام الزواحف؟",["الحراشف","الريش","الشعر","الأشواك"],"الحراشف تقلل تبخر الماء من الجسم."],
 ["من الثدييات التي تعيش في الماء:",["الدلفين","سمك القرش","الأوز","الأخطبوط"],"الدلفين ثديي يتنفس الهواء بالرئتين."],
 ["الثديي الوحيد القادر على الطيران:",["الخفاش","النعامة","الحمامة","الفراشة"],"الحمامة طائر وليست ثدياً، والفراشة حشرة."],
 ["تتنفس البرمائيات بالرئتين وأيضاً عن طريق:",["جلدها الرطب","ريشها","حراشفها","زعانفها"],"لذلك تعيش البرمائيات قرب الماء دائماً."],
 ["بماذا تمتاز الطيور القادرة على الطيران؟",["عظام مجوفة خفيفة","عظام ثقيلة","أسنان قوية","زعانف"],"العظام الخفيفة والأجنحة والعضلات القوية تساعدها على الطيران."],
 ["كم تشكل اللافقريات من أنواع الحيوانات تقريباً؟",["95%","50%","10%","25%"],"اللافقريات هي الأكثر عدداً في الطبيعة."],
 ["جسم الإسفنج مملوء بـ:",["الثقوب","القشور","الحراشف","الريش"],"لذلك سميت هذه الحيوانات بالمساميات."],
 ["يتنفس الروبيان عن طريق:",["الخياشيم","الرئة","الجلد","الأنابيب الدقيقة"],"الروبيان والسرطان يتنفسان بالخياشيم."],
 ["أكبر مجموعة من اللافقريات هي:",["المفصليات","المساميات","الديدان","الأسماك"],"الأسماك فقرية، والمفصليات أكبر مجموعة لافقرية."],
 ["لماذا دودة الأرض مفيدة للتربة؟",["تحفر أنفاقاً تهوي التربة","تسبب الأمراض","تأكل الثمار","تلقح الأزهار"],"الأنفاق تدخل الهواء إلى التربة."]]},

{u:1,no:"الفصل الثالث",t:"جهازا الدوران والتنفس",e:"❤️",
lessons:[
 {t:"جهاز الدوران وصحته",idea:"جهاز الدوران ينقل المواد داخل الجسم، ويتكون من القلب والأوعية الدموية والدم.",
  pts:["**القلب**: داخل القفص الصدري، يميل قليلاً إلى اليسار، ينقبض وينبسط ليدفع الدم.","**الشرايين**: تنقل الدم من القلب إلى أنحاء الجسم.","**الأوردة**: تنقل الدم من أنحاء الجسم إلى القلب.","**الدم**: سائل أحمر لزج، ينقل الغازات والغذاء والفضلات، ويوزع الحرارة. يشكل نحو 7% من وزن الجسم.","مكونات الدم: **البلازما** (السائل)، و**الخلايا الحمراء** تنقل الغازات، و**الخلايا البيضاء** تحمي من الأمراض، و**الصفيحات** توقف النزف.","**الدورة الدموية**: حركة الدم من القلب إلى الجسم ثم عودته إلى القلب، وهي دورة مغلقة.","للحفاظ عليه: غذاء غني بالحديد، ورياضة، وتنظيف الجروح.","**فقر الدم**: قلة الخلايا الحمراء أو الحديد في الدم."],
  fact:"مكتشف الدورة الدموية الصغرى هو العالم العربي ابن النفيس."},
 {t:"جهاز التنفس وصحته",idea:"جهاز التنفس يبادل الغازات بين الجسم والهواء الخارجي، فيدخل الأوكسجين ويخرج ثنائي أوكسيد الكاربون.",
  pts:["مسار الهواء: **الأنف** ← **البلعوم** ← **القصبة الهوائية** ← **الرئتان**.","**البلعوم**: تركيب مشترك بين جهازي التنفس والهضم.","**القصبة الهوائية**: أنبوب يتفرع إلى فرعين، كل فرع يدخل رئة.","**الرئتان**: عضوان إسفنجيان داخل القفص الصدري.","**الحجاب الحاجز**: عضلة تحت الرئتين، ترتفع وتنخفض فتساعد على الشهيق والزفير.","**التبادل الغازي**: يحدث داخل الرئتين، ثم يُطرح ثنائي أوكسيد الكاربون بالزفير.","للحفاظ عليه: ابتعد عن الدخان والهواء الملوث، ولا تنتقل فجأة من الحر إلى غرفة باردة، وكُل الحمضيات.","من أمراضه: **الإنفلونزا** و**الربو**."],
  fact:"الرئة اليمنى ثلاثة فصوص، والرئة اليسرى فصّان فقط."}],
vocab:[["القلب","العضو الأساسي في جهاز الدوران"],["الشرايين","أوعية تنقل الدم من القلب إلى الجسم"],["الأوردة","أوعية تنقل الدم من الجسم إلى القلب"],["خلايا الدم الحمراء","خلايا قرصية تنقل الغازات"],["خلايا الدم البيضاء","خلايا تحمي الجسم من الأمراض"],["الدورة الدموية","حركة الدم من القلب إلى الجسم وعودته"],["البلعوم","ممر مشترك بين جهازي التنفس والهضم"],["القصبة الهوائية","أنبوب ينقل الهواء إلى الرئتين"],["الحجاب الحاجز","عضلة تساعد على الشهيق والزفير"],["التبادل الغازي","تبادل الغازات بين الجسم والهواء داخل الرئتين"]],
quiz:[
 ["العضو الأساسي في جهاز الدوران هو:",["القلب","الرئة","المعدة","الكلية"],"القلب يدفع الدم إلى أنحاء الجسم."],
 ["الأوعية التي تنقل الدم من القلب إلى الجسم:",["الشرايين","الأوردة","الحالب","القصبة الهوائية"],"الشرايين تخرج من القلب، والأوردة تعود إليه."],
 ["الأوعية التي تعيد الدم إلى القلب:",["الأوردة","الشرايين","المريء","الحالب"],"الأوردة تحمل الدم المحمل بالفضلات إلى القلب."],
 ["ما وظيفة خلايا الدم الحمراء؟",["نقل الغازات","الدفاع عن الجسم","إيقاف النزف","هضم الطعام"],"وهي التي تعطي الدم لونه الأحمر."],
 ["جُرح إصبعك. ما الذي يوقف النزف؟",["الصفيحات الدموية","الخلايا الحمراء","البلازما","الخلايا البيضاء"],"الصفيحات تخثر الدم عند الجرح."],
 ["أي خلايا تحمي الجسم من الأمراض؟",["الخلايا البيضاء","الخلايا الحمراء","الصفيحات","البلازما"],"وظيفة الخلايا البيضاء دفاعية."],
 ["من مكتشف الدورة الدموية الصغرى؟",["ابن النفيس","جابر بن حيان","ابن سينا","الخوارزمي"],"ابن النفيس عالم عربي."],
 ["مرض تقل فيه خلايا الدم الحمراء أو الحديد:",["فقر الدم","الربو","الإنفلونزا","قرحة المعدة"],"لذلك نأكل أغذية غنية بالحديد."],
 ["التركيب المشترك بين جهازي التنفس والهضم:",["البلعوم","القصبة الهوائية","المريء","الحجاب الحاجز"],"يمر به الهواء والطعام معاً."],
 ["العضلة التي تساعد على الشهيق والزفير:",["الحجاب الحاجز","القلب","المعدة","البلعوم"],"يرتفع وينخفض تحت الرئتين."],
 ["أين يحدث التبادل الغازي؟",["داخل الرئتين","في الأنف","في المعدة","في القلب"],"يتبادل الهواء والدم الغازات داخل الرئتين."],
 ["من أمراض الجهاز التنفسي:",["الربو","فقر الدم","السكري","التسمم الغذائي"],"الربو والإنفلونزا تصيبان جهاز التنفس."],
 ["كم فصاً في الرئة اليمنى؟",["ثلاثة","اثنان","واحد","أربعة"],"اليمنى ثلاثة فصوص، واليسرى فصّان."]]},

{u:1,no:"الفصل الرابع",t:"الجهازان الهضمي والبولي",e:"🍎",
lessons:[
 {t:"الجهاز الهضمي وصحته",idea:"الجهاز الهضمي يحوّل الغذاء إلى مواد بسيطة يمتصها الجسم.",
  pts:["مسار الطعام: **الفم** ← **البلعوم** ← **المريء** ← **المعدة** ← **الأمعاء الدقيقة** ← **الأمعاء الغليظة** ← فتحة المخرج.","**الهضم**: تحويل الغذاء إلى مواد بسيطة ليسهل امتصاصه.","في **الفم**: الأسنان تقطع الطعام، و**اللعاب** يرطبه، واللسان يساعد على البلع.","**المريء**: أنبوب عضلي ينقل الطعام إلى المعدة.","**المعدة**: كيس عضلي يتحرك ويفرز مواد كيميائية، فيصبح الطعام كتلة سائلة.","**الأمعاء الدقيقة**: طولها نحو 6 أمتار، فيها يكتمل الهضم ويتم **الامتصاص**.","**الأمعاء الغليظة**: طولها نحو 1.5 متر، لا هضم فيها، تفرز مخاطاً يسهّل طرح الفضلات.","**الكبد**: في يمين البطن، يفرز **الصفراء** لهضم الدهون. **البنكرياس**: أسفل المعدة، يفرز **الإنسولين** لتنظيم السكر.","صحته: امضغ جيداً، وكُل غذاءً متوازناً، وتجنب الطعام المكشوف، ولا تنم بعد الأكل مباشرة."],
  fact:"لا يحدث أي نوع من الهضم في الأمعاء الغليظة."},
 {t:"الجهاز البولي وصحته",idea:"الجهاز البولي ينقي الدم ويطرح الفضلات والماء الزائد خارج الجسم.",
  pts:["أعضاؤه: **الكليتان** ← **الحالب** ← **المثانة** ← **الإحليل**.","**الكلية**: تشبه حبة الفاصولياء، تنقي الدم من الفضلات.","**الحالب**: أنبوب يصل الكلية بالمثانة.","**المثانة**: كيس عضلي مرن أسفل البطن، يتمدد كلما تجمع فيه البول.","**الإحليل**: أنبوب ينقل البول من المثانة إلى خارج الجسم.","البول: **95%** ماء، و**2%** أملاح، والباقي مادة اليوريا.","**الإخراج**: تخلص الجسم من الفضلات والماء الزائد والأملاح عن طريق الكلية.","يشكل الماء 60 إلى 70% من وزن الجسم.","صحته: اشرب الماء باعتدال، وتجنب الضربات على الظهر، وقلل الأملاح لأنها تكوّن **الحصى**."],
  fact:"يمر كل الدم الموجود في جسمك عبر الكليتين نحو 30 مرة في اليوم الواحد."}],
vocab:[["الهضم","تحويل الغذاء إلى مواد بسيطة سهلة الامتصاص"],["المريء","أنبوب عضلي ينقل الطعام إلى المعدة"],["الأمعاء الدقيقة","فيها يكتمل الهضم والامتصاص"],["الكبد","يفرز الصفراء لهضم الدهون"],["البنكرياس","يفرز الإنسولين لتنظيم السكر في الدم"],["الكلية","عضو ينقي الدم من الفضلات"],["الحالب","أنبوب يصل الكلية بالمثانة"],["المثانة","كيس عضلي مرن يخزن البول"],["الإحليل","أنبوب ينقل البول إلى خارج الجسم"],["الإخراج","تخلص الجسم من الفضلات والماء الزائد"]],
quiz:[
 ["عملية تحويل الغذاء إلى مواد بسيطة تسمى:",["الهضم","الإخراج","التنفس","الترسيب"],"الهضم يسهّل امتصاص الغذاء."],
 ["أين تبدأ أولى خطوات الهضم؟",["الفم","المعدة","الأمعاء الدقيقة","الأمعاء الغليظة"],"في الفم تقطع الأسنان الطعام ويرطبه اللعاب."],
 ["مادة تفرز في الفم وترطب الطعام:",["اللعاب","الصفراء","المخاط","العرق"],"اللعاب يسهّل بلع الطعام."],

{u:2,no:"الفصل الخامس",t:"العناصر",e:"⚗️",
lessons:[
 {t:"العناصر وأنواعها",idea:"العنصر أبسط وحدة بنائية للمواد، ولا يمكن تجزئته إلى مواد أبسط منه بالتغيرات الفيزيائية والكيميائية.",
  pts:["كل المواد من حولنا مثل الحجر والزجاج والخشب تتكون من عناصر.","عدد العناصر المعروفة **118** عنصراً، منها **94** موجودة في الطبيعة.","توجد العناصر بثلاث حالات: **صلبة** مثل الذهب، و**سائلة** مثل الزئبق والبروم، و**غازية** مثل الأوكسجين.","**الفلزات**: لها بريق معدني، تقبل الطرق والسحب، وتوصل الحرارة والكهرباء. مثل الحديد والنحاس والذهب والفضة.","**اللافلزات**: بلا بريق، لا تقبل الطرق، ولا توصل الحرارة والكهرباء. أغلبها غازات مثل الأوكسجين، والصلبة منها هشة مثل الكاربون والكبريت.","**أشباه الفلزات**: لها صفات مشتركة بين الفلزات واللافلزات، مثل **السيليكون**."],
  fact:"الزئبق فلز سائل، والبروم لافلز سائل."},
 {t:"العناصر الشائعة وخصائصها",idea:"من أشهر العناصر الكاربون والأوكسجين والهيدروجين والحديد، وتختلف في قابليتها للتغير الكيميائي.",
  pts:["**الخاصية الكيميائية**: قابلية المادة للتغير الكيميائي الذي ينتج عنه مواد جديدة.","**الكاربون**: لافلز، صورتاه **الماس** و**الكرافيت**. الكرافيت لأقلام الرصاص، والماس من أصلب العناصر يقطع الزجاج.","**الأوكسجين**: غاز بلا لون ولا طعم ولا رائحة، لا يحترق لكنه **يساعد على الاحتراق**، تطرحه النباتات.","يستخدم الأوكسجين في المستشفيات وأجهزة تنفس الغواصين ورجال الإطفاء ورواد الفضاء.","**الهيدروجين**: أخف العناصر، يحترق ولا يساعد على الاحتراق، يُستخدم **وقوداً للصواريخ**.","**الحديد**: من أرخص المعادن، صلب، تُبنى به المباني والجسور والسيارات، لكنه **يصدأ** في الهواء.","الحديد يدخل في تركيب الدم، ونقصه يسبب **فقر الدم**. نجده في السبانخ والكرفس."],
  fact:"العالم المسلم جابر بن حيان من أشهر علماء الكيمياء في التاريخ."}],

{u:2,no:"الفصل السادس",t:"المركبات والمخاليط",e:"🧪",
lessons:[
 {t:"المركبات الكيميائية وأنواعها",idea:"المركب مادة تنتج من اتحاد عنصرين أو أكثر بنسب ثابتة، وتختلف صفاته عن صفات العناصر المكوّنة له.",
  pts:["عند تكوين المركب يفقد كل عنصر **خواصه الأصلية**، ويصعب فصل مكوناته.","**ملح الطعام**: من الصوديوم والكلور، كلاهما سام وحده، لكن الملح مفيد لنا.","**الماء**: مركب من الهيدروجين والأوكسجين.","**ثنائي أوكسيد الكاربون**: من الكاربون والأوكسجين، نطرحه بالزفير وتستعمله النباتات.","**صدأ الحديد**: مركب من الحديد والأوكسجين، وهو مثال على التغير الكيميائي.","تصنف المركبات إلى ثلاثة أنواع:","**الحوامض**: طعمها لاذع مثل الخل وحامض الليمون، وبعضها حارق للجلد.","**القواعد**: طعمها مر وملمسها صابوني مثل الصابون. لا تلمسها ولا تتذوقها.","**الأملاح**: صلبة طعمها مالح، مثل ملح الطعام."],
  fact:"عدد العناصر محدود، لكنها تتحد معاً لتكوّن عدداً هائلاً من المركبات."},
 {t:"المخاليط وأنواعها",idea:"المخلوط ينتج من مزج مادتين أو أكثر بأي نسبة، وتبقى كل مادة بخواصها، ويمكن فصلها بطرائق فيزيائية بسيطة.",
  pts:["**مخلوط غير متجانس**: نرى مكوناته بوضوح، مثل برادة الحديد مع الرمل، والزيتون مع الخل.","**مخلوط متجانس (محلول)**: لا نميز مكوناته، مثل السكر مع الماء، والملح مع الماء، وعصير الليمون.","أنواع المخاليط المتجانسة:","سائل مع سائل: الخل والماء. سائل مع غاز: الغيوم والمشروبات الغازية.","صلب مع غاز: الغبار. غاز مع غاز: **الهواء**. صلب مع صلب: **السبائك**.","**السبيكة**: مخلوط متجانس من فلزات، مثل الفولاذ (حديد وكاربون)، والعملات المعدنية.","طرائق الفصل البسيطة: **اليد، المغناطيس، الطفو، الترشيح، الغربال**.","طرائق غير بسيطة: **التبخر والغليان**، مثل فصل الملح عن الماء.","**الفرق**: المركب بنسب ثابتة وتفقد مكوناته خواصها، أما المخلوط فبأي نسبة وتبقى خواص مكوناته."],
  fact:"الميداليات الذهبية والفضية والبرونزية كلها سبائك."}],

{u:3,no:"الفصل السابع",t:"الاحتكاك",e:"🛞",
lessons:[
 {t:"قوة الاحتكاك",idea:"الاحتكاك قوة تبطئ حركة جسم على سطح يلامسه أو توقفه، وتؤثر عكس اتجاه حركته.",
  pts:["الكرة المتدحرجة تتباطأ ثم تتوقف بسبب **قوة الاحتكاك**.","على **السطح الأملس**: الاحتكاك قليل، فالسرعة أكبر والمسافة أطول.","على **السطح الخشن**: الاحتكاك كبير، فالسرعة أقل والمسافة أقصر.","تعتمد قوة الاحتكاك على: **طبيعة السطحين المتلامسين** و**وزن الجسم المتحرك**.","تحريك عربة فارغة أسهل من تحريكها وهي محملة، لأن الوزن يزيد الاحتكاك.","فوائد الاحتكاك: يمنع انزلاق السيارات، ويساعدنا على **المشي بتوازن**، و**الإمساك بالأشياء**."],
  fact:"لا يوجد سطح أملس تماماً. لذلك ينصح السائقون بتقليل السرعة في الأيام الممطرة."},
 {t:"أنواع الاحتكاك",idea:"للاحتكاك أنواع: سكوني وانزلاقي وتدحرجي، وللهواء والماء احتكاك يسمى المقاومة.",
  pts:["**الاحتكاك السكوني**: عندما لا توجد حركة بين السطحين، مثل برميل لا تستطيع تحريكه. وهو **الأكبر**.","**الاحتكاك الانزلاقي**: عندما ينزلق جسم على سطح، وهو أقل من السكوني.","**الاحتكاك التدحرجي**: عندما يتدحرج جسم على سطح، وهو **الأقل**.","**مقاومة الهواء**: احتكاك عند حركة جسم في الهواء، مثل السيارة والطائرة.","**مقاومة الماء**: احتكاك عند حركة جسم في الماء، مثل السفينة والسمكة.","الشكل **الانسيابي** للسيارات والطائرات يقلل مقاومة الهواء.","أضرار الاحتكاك: يرفع حرارة أجزاء الآلات ويتلفها.","نقلل الاحتكاك بـ: **الزيوت والشحوم**، و**الكرات المعدنية الصغيرة**، و**العجلات**."],
  fact:"آلة الخياطة تحتاج إلى تزييت مستمر لتقليل الاحتكاك بين أجزائها."}],

 ["لماذا تكون قاعدة أحذية الرياضيين خشنة؟",["لزيادة الاحتكاك ومنع الانزلاق","لتقليل الاحتكاك","لتصبح أخف","لتصبح أجمل"],"الاحتكاك يساعدهم على الركض بثبات."]]},

{u:3,no:"الفصل الثامن",t:"الكهربائية والمغناطيسية",e:"⚡",
lessons:[
 {t:"الكهربائية الساكنة",idea:"التكهرب ظاهرة تحدث عندما يفقد الجسم أو يكتسب شحنات كهربائية، والشحنات نوعان موجبة وسالبة.",
  pts:["الشحنات نوعان: **موجبة (+)** و**سالبة (−)**.","عند دلك مسطرة بلاستيكية بالصوف تكتسب شحنة سالبة، فتجذب قصاصات الورق.","**الكهربائية الساكنة**: تجمع الشحنات على سطوح الأجسام.","الشحنات **المتشابهة تتنافر**، والشحنات **المختلفة تتجاذب**.","**الجسم المتعادل**: عدد شحناته الموجبة يساوي عدد شحناته السالبة.","**التفريغ الكهربائي**: فقدان الجسم المشحون لشحنته، مثل الصعقة الخفيفة عند لمس مقبض الباب.","**البرق**: انتقال الشحنات بين سحابتين، فتنتج حرارة وضوء ثم صوت قوي.","**الصاعقة**: تفريغ الشحنات من السحابة إلى الأرض، ونحمي البنايات منها بـ**مانعة الصواعق**."],
  fact:"يوجد في الطبيعة نوعان فقط من الشحنات الكهربائية."},
 {t:"الكهربائية المتحركة",idea:"تتكون الدارة الكهربائية البسيطة من بطارية ومصباح ومفتاح وأسلاك، وهي مسار مغلق يمر فيه التيار.",
  pts:["**الكهربائية المتحركة**: تنتج من حركة الشحنات عبر أسلاك موصلة.","**التيار الكهربائي**: شحنات تنتقل من نقطة إلى أخرى عبر الأسلاك، فيشغّل الأجهزة.","تتولد الكهرباء في **محطات توليد الطاقة** وتصل إلى بيوتنا بالأسلاك.","أجزاء **الدارة البسيطة**: **البطارية** (مصدر الطاقة)، و**المصباح**، و**أسلاك التوصيل**، و**المفتاح**.","**المفتاح الكهربائي**: يتحكم في غلق الدارة وفتحها.","**دارة مغلقة**: يمر التيار، فيضيء المصباح.","**دارة مفتوحة**: لا يمر التيار، فلا يضيء المصباح."],
  fact:"إنتاج الكهرباء مكلف، لذلك نطفئ الأجهزة التي لا نستخدمها."},
 {t:"المغناطيسية",idea:"لكل مغناطيس قطبان شمالي وجنوبي تتركز فيهما قوته، وحوله مجال مغناطيسي.",
  pts:["أشكال المغانط: مستقيم، حذوة فرس، حلقة، قرص. ويوجد مغناطيس طبيعي على شكل حجر.","**المواد المغناطيسية**: يجذبها المغناطيس، مثل **الحديد والكوبلت والنيكل**.","**المواد غير المغناطيسية**: لا يجذبها، مثل الخشب والبلاستيك والزجاج والمطاط والنحاس.","يجذب المغناطيس الحديد حتى من خلال الماء والزجاج والورق المقوى.","القطبان: **شمالي (N)** و**جنوبي (S)**. المتشابهة **تتنافر**، والمختلفة **تتجاذب**.","إذا قطعنا المغناطيس، تصبح كل قطعة مغناطيساً له **قطبان**.","يفقد المغناطيس مغناطيسيته بـ**الطرق الشديد** أو **التسخين**.","**المجال المغناطيسي**: المنطقة حول المغناطيس التي تظهر فيها قوته. ترسمه برادة الحديد.","نصنع مغناطيساً بـ**الدلك** (باتجاه واحد) أو بـ**الحث** (التقريب)، والحث يزول بإبعاد المغناطيس.","**البوصلة**: إبرة ممغنطة تحدد الاتجاهات."],
  fact:"رؤوس مفكات البراغي تُصنع ممغنطة لتمسك البراغي الحديدية."}],
vocab:[["الشحنات الكهربائية","جسيمات صغيرة جداً، موجبة أو سالبة"],["الكهربائية الساكنة","تجمع الشحنات على سطوح الأجسام"],["التفريغ الكهربائي","فقدان الجسم المشحون لشحنته"],["الصاعقة","تفريغ الشحنات من السحابة إلى الأرض"],["التيار الكهربائي","شحنات تنتقل عبر أسلاك موصلة"],["الدارة الكهربائية","مسار مغلق يمر فيه التيار"],["المفتاح الكهربائي","أداة تغلق الدارة وتفتحها"],["المواد المغناطيسية","مواد يجذبها المغناطيس، مثل الحديد"],["المجال المغناطيسي","المنطقة التي تظهر فيها قوة المغناطيس"],["التمغنط بالحث","صنع مغناطيس بالتقريب، ويزول بالإبعاد"]],
quiz:[

 ["الشحنات الكهربائية المتشابهة:",["تتنافر","تتجاذب","تختفي","تتحد"],"والمختلفة تتجاذب."],
 ["الجسم المتعادل كهربائياً يكون فيه:",["عدد الشحنات الموجبة يساوي السالبة","الشحنات الموجبة أكثر","الشحنات السالبة أكثر","لا شحنات أبداً"],"تساوي الشحنات يجعل الجسم متعادلاً."],
 ["فقدان الجسم المشحون لشحنته يسمى:",["التفريغ الكهربائي","التكهرب","التمغنط","الاحتكاك"],"مثل الصعقة الخفيفة عند لمس مقبض الباب."],
 ["لحماية البنايات العالية من الصواعق نضع:",["مانعة الصواعق","بوصلة","مغناطيساً","بطارية"],"وهي ساق معدنية في أعلى البناية."],
 ["التيار الكهربائي هو:",["شحنات تنتقل عبر أسلاك موصلة","ماء يجري في أنابيب","هواء متحرك","ضوء الشمس"],"وهو الذي يشغّل الأجهزة الكهربائية."],
 ["جزء الدارة الذي يتحكم في غلقها وفتحها:",["المفتاح الكهربائي","المصباح","البطارية","الأسلاك"],"المفتاح يسمح بمرور التيار أو يقطعه."],
 ["إضاءة المصباح في الدارة تعني أن الدارة:",["مغلقة","مفتوحة","مقطوعة","بلا بطارية"],"في الدارة المغلقة يمر التيار."],
 ["أي المواد الآتية يجذبها المغناطيس؟",["الحديد","الخشب","الزجاج","النحاس"],"الحديد والكوبلت والنيكل مواد مغناطيسية."],
 ["الأقطاب المغناطيسية المختلفة:",["تتجاذب","تتنافر","تختفي","تتساوى"],"الشمالي يجذب الجنوبي."],
 ["إذا قطعنا مغناطيساً إلى قطع صغيرة:",["تصبح كل قطعة مغناطيساً بقطبين","يختفي المغناطيس","يبقى قطب واحد","تصبح قطعاً من الخشب"],"لا يمكن الحصول على قطب منفرد."],
 ["يفقد المغناطيس مغناطيسيته عند:",["التسخين أو الطرق الشديد","الدلك","الحث","وضعه في الماء"],"الحرارة والطرق الشديد يُفقدانه قوته."],
 ["المنطقة حول المغناطيس التي تظهر فيها قوته:",["المجال المغناطيسي","الدارة الكهربائية","القطب الشمالي","التيار"],"برادة الحديد ترسم خطوطه."],
 ["الأداة التي تستعمل المغناطيس لتحديد الاتجاهات:",["البوصلة","الميزان","المسطرة","المصباح"],"إبرتها تشير دائماً إلى الشمال والجنوب."]]},

{u:4,no:"الفصل التاسع",t:"الأرض ومواردها",e:"🌊",
lessons:[
 {t:"البحار والمحيطات",idea:"تغطي البحار والمحيطات نحو ثلاثة أرباع سطح الأرض، ومياهها مالحة، ولقيعانها تضاريس مثل اليابسة.",
  pts:["تشكل المياه نحو **71%** من سطح الكرة الأرضية.","أصناف البحار: **خارجية** متصلة بالمحيط، و**داخلية** تتصل بالمحيط بقنوات، و**مغلقة** تحيط بها اليابسة.","المحيطات مساحات شاسعة، مثل **الهادي** و**الهندي** و**الأطلسي**.","قاع المحيط فيه جبال وسهول وبراكين وجزر وخنادق ووديان.","**حواف القارات**: المنطقة التي تتصل فيها اليابسة بالبحر مباشرة.","نقيس عمق البحر بـ**صدى الصوت**: يُرسل صوت إلى القاع ويُقاس زمن ذهابه وعودته.","أهمية البحار: غذاء (أسماك)، وطاقة (نفط وغاز)، ومواصلات، وأملاح، وتنظيم المناخ.","**دورة الماء**: الشمس تبخر ماء البحار ← يتكاثف غيوماً ← يهطل مطراً أو ثلجاً ← يعود إلى البحار.","**الملوحة**: كمية الأملاح الذائبة في كيلوغرام من ماء البحر. مصدرها **اليابسة** تحملها المياه الجارية.","ماء البحر: **96%** ماء و**4%** أملاح ومواد صلبة."],
  fact:"تقل حرارة ماء البحر كلما تعمقنا، وينعدم ضوء الشمس عند عمق نحو 360 متراً."},
 {t:"الطاقات المتجددة",idea:"الطاقة المتجددة طاقة طبيعية دائمة لا تنفد ولا تلوث البيئة، مثل الشمس والرياح والماء.",
  pts:["**الطاقة غير المتجددة**: من الوقود الأحفوري (الفحم والنفط والغاز)، تنفد وتلوث البيئة.","**الطاقة الشمسية**: نستعملها في البيوت الزجاجية، والسخان الشمسي، و**ألواح الخلايا الشمسية** لإنتاج الكهرباء.","**طاقة الرياح**: حركت المراكب الشراعية وطواحين الهواء، واليوم تدير مراوح تولّد الكهرباء.","الرياح قوية في المناطق **الساحلية والصحراوية**، ولا تصلح بين البيوت لأن المباني تبطئها.","**الطاقة المائية**: من حركة الماء في الأنهار والسدود، تدير التوربينات لتوليد الكهرباء.","**طاقة المد والجزر**: ارتفاع ماء البحر (المد) وانخفاضه (الجزر) بسبب **جاذبية القمر والشمس**.","**طاقة الأرض الجوفية**: من حرارة باطن الأرض، تُستعمل في التدفئة وتوليد الكهرباء."],
  fact:"عين حمّام العليل في الموصل ينبوع ماء حار، يقصده الناس للسياحة والعلاج."}],
vocab:[["البحار","تجمعات مائية كبيرة تحيط باليابسة"],["المحيطات","مساحات مائية شاسعة مثل المحيط الهادي"],["حواف القارات","حيث تتصل اليابسة بالبحر مباشرة"],["دورة الماء","انتقال الماء من البحار إلى الجو ثم عودته"],["الملوحة","كمية الأملاح الذائبة في ماء البحر"],["الطاقة المتجددة","طاقة دائمة لا تنفد ولا تلوث البيئة"],["الطاقة غير المتجددة","طاقة تنفد وتلوث، مثل النفط"],["طاقة المد والجزر","طاقة من ارتفاع ماء البحر وانخفاضه"],["طاقة الأرض الجوفية","طاقة من حرارة باطن الأرض"]],

 ["الطاقة المستمدة من حرارة باطن الأرض:",["طاقة الأرض الجوفية","طاقة الرياح","الطاقة الشمسية","الطاقة المائية"],"باطن الأرض شديد الحرارة."],
 ["لماذا لا تصلح طاقة الرياح بين البيوت؟",["المباني تبطئ الرياح وتجعلها غير منتظمة","الرياح هناك سريعة جداً","البيوت تحتاج كهرباء قليلة","الرياح لا تهب في المدن"],"المباني تعمل كمصدات للرياح."]]},

{u:4,no:"الفصل العاشر",t:"الكون",e:"🌍",
lessons:[
 {t:"نشأة الأرض",idea:"الأرض كروية الشكل، تتكون من طبقات متحدة المركز، ونعرف تاريخها من سلم الزمن الجيولوجي.",
  pts:["أدلة كروية الأرض: اختلاف **الليل والنهار** بين الدول، ورؤية **أعلى السفينة** القادمة أولاً، و**صور الأقمار الصناعية**.","تبدو الأرض منبسطة لأن المساحة التي نمشي عليها صغيرة جداً.","طبقات الأرض (تشبه ثمرة الخوخ):","**القشرة الأرضية**: الطبقة الخارجية، فيها الجبال وقيعان البحار، وهي الأقل حرارة.","**الستار**: تحت القشرة، فيه صخور منصهرة، وهو مصدر **الحمم البركانية**.","**اللب**: قلب الأرض، معادن وصخور حرارتها عالية جداً.","**الزمن الجيولوجي**: تاريخ الأرض منذ نشأتها حتى الآن.","**الدهر** أكبر وحدة زمنية، وينقسم إلى **حقب**.","**الأحافير**: بصمات أو بقايا كائنات عاشت قبل ملايين السنين، تخبرنا بعمر الأرض وتطور الحياة والمناخ القديم.","**دهر الحياة المستترة** يشكل 80% من عمر الأرض، ثم **دهر الحياة الظاهرة** بحقبه الثلاث.","**القديمة**: لافقريات ونباتات لازهرية. **المتوسطة**: الزواحف والديناصورات. **الحديثة**: الثدييات والطيور والنباتات الزهرية."],
  fact:"وجود أحافير النخيل في صخور قديمة يدل على أن المناخ كان حاراً في ذلك الزمن."},
 {t:"العمليات الجيولوجية",idea:"التجوية والتعرية والترسيب عمليات جيولوجية تغيّر سطح الأرض ببطء.",
  pts:["**التجوية**: تفتت الصخور إلى أجزاء أصغر بفعل العوامل الجوية، وتبقى في مكانها.","**التجوية الفيزيائية**: تفتت بلا تغير في تركيب الصخر، أسبابها:","اختلاف الحرارة بين الليل والنهار، وتجمد ماء المطر في الشقوق، ونمو الجذور، وحفر النمل والديدان.","**التجوية الكيميائية**: تفتت مع تغير تركيب الصخر، مثل إذابة مياه الأمطار للأملاح (تتلف التماثيل الأثرية).","**التعرية**: نقل الفتات الصخري من مكان إلى آخر بالرياح والأمطار والأمواج والمياه الجارية والجليد والجاذبية.","من أضرار التعرية: **انجراف التربة**.","نقلل التعرية بـ: **زراعة الأشجار** والأعشاب، و**مصدات الرياح**، و**الجدران الاستنادية**.","**الترسيب**: تراكم ما تحمله الرياح والمياه عندما تتباطأ، فتتكون **الكثبان الرملية** و**الصخور الرسوبية**."],
  fact:"الفرق بينهما: التجوية تفتت الصخر في مكانه، والتعرية تنقل الفتات إلى مكان آخر."}],
vocab:[["القشرة الأرضية","الطبقة الخارجية للأرض"],["الستار","طبقة تحت القشرة فيها صخور منصهرة"],["اللب","قلب الأرض، شديد الحرارة"],["الزمن الجيولوجي","تاريخ الأرض منذ نشأتها حتى الآن"],["الدهر","أكبر وحدة في سلم الزمن الجيولوجي"],["الحقبة","مدة بين ظهور كائنات وانقراض أخرى"],["الأحافير","بقايا أو بصمات كائنات عاشت قديماً"],["التجوية","تفتت الصخور إلى أجزاء أصغر"],["التعرية","نقل الفتات الصخري إلى مكان آخر"],["الترسيب","تراكم ما تحمله الرياح والمياه"]],
quiz:[

const TKEY="sci5-theme";
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem(TKEY,t)}catch(e){}}
try{const t=localStorage.getItem(TKEY);if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}

const KEY="sci5-best-v1";

const starsOf=p=>p>=0.9?3:p>=0.7?2:p>=0.5?1:0;
const totalStars=()=>CH.reduce((s,_,i)=>s+(best[i]||0),0);

const md=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const starRow=n=>[0,1,2].map(i=>`<span class="${i<n?'on':'off'}">★</span>`).join("");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

   <button class="tab" role="tab" data-t="sum"><span class="ic">📖</span>الملخص</button>
   <button class="tab" role="tab" data-t="fc"><span class="ic">🃏</span>بطاقات الكلمات</button>
   <button class="tab" role="tab" data-t="quiz"><span class="ic">✏️</span>الاختبار</button>

  const set=t=>{app.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));

function cards(i){
  const v=CH[i].vocab;let k=0;
  pane().innerHTML=`<div class="fc-wrap"><p class="fc-hint">اقرأ الكلمة وتذكّر معناها، ثم اضغط على البطاقة لتقلبها.</p>

   <button class="btn" id="toQ">✏️ أنا جاهز للاختبار</button></div>`;
  const fc=document.getElementById("fc");
  const show=()=>{fc.classList.remove("flip");setTimeout(()=>{document.getElementById("fw").textContent=v[k][0];document.getElementById("fb").textContent=v[k][1];},fc.classList.contains("flip")?0:120);document.getElementById("fn").textContent=`${k+1} / ${v.length}`};
  document.getElementById("fw").textContent=v[0][0];document.getElementById("fb").textContent=v[0][1];
  document.getElementById("fn").textContent=`1 / ${v.length}`;
  fc.onclick=()=>fc.classList.toggle("flip");
  document.getElementById("nx").onclick=()=>{k=(k+1)%v.length;show()};
  document.getElementById("pv").onclick=()=>{k=(k-1+v.length)%v.length;show()};
  document.getElementById("toQ").onclick=()=>chapter(i,"quiz");
}

/* ---------- quiz engine ---------- */
function runQuiz(qs,onDone,root){
  let n=0,score=0;const wrong=[];
  const step=()=>{
    const [q,opts,x]=qs[n];const right=opts[0];const sh=shuffle(opts);
    root.innerHTML=`<div class="qbox pop"><div class="qtop"><span>سؤال ${n+1} من ${qs.length}</span><span class="sc">✔ ${score}</span></div>
     <div class="qbar"><i style="width:${n/qs.length*100}%"></i></div>
     <div class="q">${q}</div><div class="opts">${sh.map((o,j)=>`<button class="opt" data-o="${j}"><span class="k">${LETTERS[j]}</span><span>${o}</span></button>`).join("")}</div>
     <div id="fbk"></div></div>`;
    root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const pick=sh[+b.dataset.o],ok=pick===right;
      root.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(sh[+o.dataset.o]===right)o.classList.add("right")});
      if(ok)score++;else{b.classList.add("wrong");wrong.push([q,right])}
      const praise=["أحسنت! 🌟","رائع! 🎉","ممتاز يا بطل! 💪","إجابة عالِم! 🔬","صحيح! 👏"];
      document.getElementById("fbk").innerHTML=`<div class="fb ${ok?'good':'bad'}"><b>${ok?praise[Math.floor(Math.random()*praise.length)]:"لا بأس، تعلّم معي 🙂"}</b>${ok?"":"الإجابة الصحيحة: <strong>"+right+"</strong>. "}${x}</div>
       <div class="qnext" style="margin-top:12px"><button class="btn" id="nxq">${n+1<qs.length?"السؤال التالي ←":"النتيجة 🏁"}</button></div>`;
      const nb=document.getElementById("nxq");nb.focus({preventScroll:true});
      nb.onclick=()=>{n++;if(n<qs.length){step();root.scrollIntoView({block:"start"});scrollBy(0,-150)}else onDone(score,wrong)};
    });
  };
  step();
}

function resultCard(score,total,wrong,again,label){
  const p=score/total,st=starsOf(p);
  const t=st===3?["🏆","عبقري صغير!"]:st===2?["🌟","عمل رائع!"]:st===1?["👍","جيد، تستطيع أكثر!"]:["📚","راجع الملخص وحاول مجدداً"];
  if(st>=2)confetti();
  return `<div class="qbox result pop"><div class="big">${t[0]}</div><h3>${t[1]}</h3><div class="rs">${starRow(st)}</div>
   <div class="num">${score} من ${total} إجابة صحيحة</div>
   <div class="row"><button class="btn" id="again">🔁 ${label||"أعد الاختبار"}</button><button class="btn ghost" id="gohome">🏠 الفصول</button></div>
   ${wrong.length?`<div class="review"><h4>راجع هذه الأسئلة:</h4>${wrong.map(w=>`<div class="rv">${w[0]}<br><span class="a">✔ ${w[1]}</span></div>`).join("")}</div>`:""}</div>`;
}

function quizStart(i){
  const root=pane();
  runQuiz(shuffle(CH[i].quiz),(score,wrong)=>{
    const st=starsOf(score/CH[i].quiz.length);
    if(st>(best[i]||0)){best[i]=st;save()}
    topBar(home);
    root.innerHTML=resultCard(score,CH[i].quiz.length,wrong);
    document.getElementById("again").onclick=()=>quizStart(i);
    document.getElementById("gohome").onclick=home;
    root.scrollIntoView({block:"start"});scrollBy(0,-150);
  },root);
}

function challenge(){
  topBar(home);app.setAttribute("style","--c:var(--btn);--cs:var(--btn-soft)");
  const pool=[];CH.forEach(c=>c.quiz.forEach(q=>pool.push(q)));
  const qs=shuffle(pool).slice(0,15);
  app.innerHTML=`<section class="hero chal"><span class="em">🏆</span><div><div class="no">من كل الفصول</div><h2>تحدي البطل</h2></div></section><div id="pane"></div>`;
  const root=pane();
  runQuiz(qs,(score,wrong)=>{
    root.innerHTML=resultCard(score,qs.length,wrong,null,"تحدٍّ جديد");
    document.getElementById("again").onclick=challenge;
    document.getElementById("gohome").onclick=home;
  },root);
  scrollTo(0,0);
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=document.createElement("div");box.className="confetti";
  const cs=["var(--u1)","var(--u2)","var(--u3)","var(--u4)","var(--u5)","var(--gold)"];
  for(let k=0;k<60;k++){const i=document.createElement("i");i.style.left=Math.random()*100+"%";i.style.background=cs[k%cs.length];i.style.animationDelay=Math.random()*.6+"s";i.style.transform=`rotate(${Math.random()*180}deg)`;box.appendChild(i)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2800);
}

const _home=home;home=function(){app.removeAttribute("style");_home()};
home();
</script>
